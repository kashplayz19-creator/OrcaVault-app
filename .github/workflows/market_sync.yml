name: Orca Vault Market Indicators Sync

on:
  schedule:
    # Run every 30 minutes between 3:45 AM UTC and 10:00 AM UTC, Mon-Fri (Indian Market Hours: 9:15 AM - 3:30 PM IST)
    - cron: '15,45 3-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  sync-market-indicators:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy supabase

      - name: Execute Market Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/market_sync.py
